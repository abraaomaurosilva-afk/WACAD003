<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Histórias de Séries</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #e50914;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background-color: #222;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 12px;
            width: 60%;
            border-radius: 5px;
            border: none;
            margin: 10px;
        }

        button {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #b20710;
        }

        #story {
            margin-top: 30px;
            font-size: 20px;
            line-height: 1.6;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎬 Gerador de Histórias de Séries</h1>

        <p>
            Digite seu nome e descubra uma história aleatória
            envolvendo séries de streaming!
        </p>

        <label for="customName">
            Digite seu nome:
        </label>

        <input
            id="customName"
            type="text"
            placeholder="Ex: Abraão"
        >

        <br>

        <button id="randomize">
            Gerar história aleatória
        </button>

        <p id="story"></p>

    </div>

    <script src="main.js"></script>

</body>

</html>
